name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies (JUCE)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev libxcomposite-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIGHTTUNE_BUILD_JUCE=ON ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests (DSP)
        run: ctest --test-dir build -C Release -R engine --output-on-failure

      - name: Tests (CLAP host)
        if: runner.os == 'Linux'
        run: ctest --test-dir build -C Release -R clap_host --output-on-failure

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          find build -name "*.vst3" -maxdepth 6 -prune -exec cp -R {} dist/ \; || true
          find build -name "*.component" -maxdepth 6 -prune -exec cp -R {} dist/ \; || true
          find build -name "LightTune.clap" -maxdepth 3 -prune -exec cp -R {} dist/ \; || true
          find build -path "*Standalone*" \( -name "LightTune" -o -name "LightTune.exe" -o -name "LightTune.app" \) -prune -exec cp -R {} dist/ \; || true
          find build \( -name "lighttune" -o -name "lighttune.exe" \) -type f -exec cp {} dist/ \; || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: LightTune-${{ matrix.os }}
          path: dist
